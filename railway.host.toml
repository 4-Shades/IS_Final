[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.agent"
buildEnvironment = "V3"

[deploy]
runtime = "V2"
numReplicas = 1
startCommand = "python -m common.serve"
healthcheckPath = "/healthz"
healthcheckTimeout = 100
sleepApplication = false
useLegacyStacker = false
ipv6EgressEnabled = false
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
APP_MODULE = "agents.host_agent.__main__"
PORT = "8000"
LLM_PROVIDER = "ollama"
OLLAMA_MODEL = "llama3.2:3b"
OLLAMA_EMBEDDING_MODEL = "embeddinggemma"
FLIGHT_SERVICE_URL = "http://<flight-private-domain>:8001"
STAY_SERVICE_URL = "http://<stay-private-domain>:8002"
ACTIVITIES_SERVICE_URL = "http://<activities-private-domain>:8003"
LLM_TIMEOUT_SECONDS = "120"
DOWNSTREAM_TIMEOUT_SECONDS = "150"
